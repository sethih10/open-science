[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fragplace"
version = "0.1.0"
description = "FragPlace: place the binding fragments of a dissociated adsorbate in their nearest non-recombining final state; LLM agents plan, deterministic tools compute"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "numpy"]

[project.optional-dependencies]
structures = ["ase", "pymatgen", "spglib", "acat", "dscribe", "scikit-learn", "pyyaml"]
mlip = ["fairchem-core", "mace-torch", "chgnet", "uncertainty-toolbox"]
literature = ["paper-qa", "mp-api"]
dft = ["custodian", "atomate2"]
agents = ["mcp[cli]>=1.2,<2"]
figures = ["matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
fragplace = "fragplace.cli.main:main"
fragplace-server = "fragplace.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fragplace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "docs/figures/src"]

[tool.ruff]
line-length = 140
target-version = "py310"
