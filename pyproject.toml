[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finalstate"
version = "0.1.0"
description = "The nearest non-recombining final state of a dissociated adsorbate: deterministic tools that LLM agents call by name"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2", "numpy"]

[project.optional-dependencies]
structures = ["ase", "pymatgen", "spglib", "acat"]
mlip = ["fairchem-core", "mace-torch", "chgnet", "dscribe", "scikit-learn", "uncertainty-toolbox"]
literature = ["paper-qa", "mp-api"]
dft = ["custodian", "atomate2"]
agents = ["mcp[cli]"]
figures = ["matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
finalstate = "finalstate.cli:main"

[tool.setuptools.packages.find]
include = ["finalstate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py39"
